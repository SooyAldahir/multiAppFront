name: multiapp
description: "multiApp - varias apps del día a día en una sola (agenda, notas, pendientes y más)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  intl: any
  # Mapas y ubicación (OpenStreetMap, sin clave)
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  geolocator: ^14.0.0
  url_launcher: ^6.3.0
  # Fotos de comida y de perfil (cámara / galería)
  image_picker: ^1.1.0
  # Notificaciones: recordatorios locales + push con Firebase
  flutter_local_notifications: ^22.0.0
  timezone: any
  flutter_timezone: ^5.0.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
